name: CtxIOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: rs.ctx.ios
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: 1
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""  # Select your own team for device signing.
    ENABLE_PREVIEWS: YES
    INFOPLIST_FILE: Sources/App/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait
    UIUserInterfaceStyle: Dark
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    from: 0.10.0
schemes:
  CtxIOS:
    build:
      targets:
        CtxIOS: all
    test:
      targets:
        - CtxIOSUITests
      environmentVariables:
        CTX_IOS_BASE_URL: $(CTX_IOS_BASE_URL)
        CTX_IOS_TOKEN: $(CTX_IOS_TOKEN)
        CTX_AUTO_CONNECT: "1"
        CTX_RESET_SELECTION: "1"
        CTX_UI_TEST_MODE: "1"
targets:
  CtxIOS:
    type: application
    platform: iOS
    dependencies:
      - package: Sodium
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: ctx
        CFBundleIdentifier: rs.ctx.ios
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        UILaunchScreen:
          UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Scan QR codes to connect the device."
        NSMicrophoneUsageDescription: "Send voice messages."
        NSPhotoLibraryUsageDescription: "Attach images."
        NSPhotoLibraryAddUsageDescription: "Save images."

  CtxIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    dependencies:
      - target: CtxIOS
    sources:
      - path: Tests/UITests
    info:
      path: Tests/UITests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.ctx.ios.uitests
