name: CtxIOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: rs.ctx.mobile
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: 1
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES
    INFOPLIST_FILE: Sources/App/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait
    UIUserInterfaceStyle: Dark
packages: {}
targets:
  CtxIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: ctx
        CFBundleIdentifier: rs.ctx.mobile
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        UILaunchScreen:
          UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Scan QR codes to connect the device."
        NSMicrophoneUsageDescription: "Send voice messages."
        NSPhotoLibraryUsageDescription: "Attach images."
        NSPhotoLibraryAddUsageDescription: "Save images."
