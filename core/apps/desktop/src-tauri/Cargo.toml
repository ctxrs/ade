[package]
name = "ctx-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "ctx"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
sha2 = "0.10"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
anyhow = "1"
directories = "5"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2.9.5", features = [] }
tauri-plugin-automation = { version = "0.1.1", optional = true }
tauri-plugin-deep-link = "2.4.5"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-shell = "2.3.4"
tauri-plugin-single-instance = { version = "2.3.6", features = ["deep-link"] }
tauri-plugin-stt = { version = "0.1", optional = true }
tokio = { version = "1", features = ["sync"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
automation = ["tauri-plugin-automation"]
stt = ["tauri-plugin-stt"]

[workspace]
