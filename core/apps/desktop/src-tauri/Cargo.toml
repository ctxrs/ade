[package]
name = "ctx-desktop"
version = "0.2.20"
edition = "2021"
build = "build.rs"

[[bin]]
name = "ctx"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
sha2 = "0.10"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
anyhow = "1"
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2.9.5", features = [] }
tauri-plugin-automation = { version = "0.1.1", optional = true }
tauri-plugin-deep-link = "2.4.5"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-shell = "2.3.2"
tauri-plugin-single-instance = { version = "2.3.6", features = ["deep-link"] }
tauri-plugin-stt = { version = "0.1", optional = true }
tauri-plugin-updater = "2.10.0"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSButton",
    "NSButtonCell",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSLayoutConstraint",
    "NSResponder",
    "NSTitlebarAccessoryViewController",
    "NSView",
    "NSViewController",
    "NSWindow",
] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
automation = ["tauri-plugin-automation"]
stt = ["tauri-plugin-stt"]

[patch.crates-io]
tauri-plugin-automation = { path = "third_party/tauri-plugin-automation" }

[workspace]
