[package]
name = "ctx-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ctx-client = { path = "../../crates/ctx-client" }
ctx-core = { path = "../../crates/ctx-core" }
ctx-providers = { path = "../../crates/ctx-providers" }
directories = "5"
futures-util = "0.3"
gpui = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d", package = "gpui" }
gpui_tokio = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d", package = "gpui_tokio" }
gpui-component = { git = "https://github.com/ctxrs/gpui-component", rev = "76d64362a1c0bdf825f83efb0ae3f4cb93849bd7", version = "0.5.0" }
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[features]
default = []
automation = ["gpui/test-support"]
cargo-clippy = []

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
gpui_tokio = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
gpui_macros = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
collections = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
http_client = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
media = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
refineable = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
sum_tree = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
util = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
util_macros = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
zlog = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
ztracing = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
ztracing_macro = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }
perf = { git = "https://github.com/ctxrs/zed", rev = "5e76b0abdcf23ea91d97cadd3972765ca125703d" }


[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.0"
core-video = { version = "0.4.3", features = ["metal"] }
objc = "0.2"

[workspace]
