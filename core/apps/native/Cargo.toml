[package]
name = "ctx-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ctx-client = { path = "../../crates/ctx-client" }
ctx-core = { path = "../../crates/ctx-core" }
ctx-providers = { path = "../../crates/ctx-providers" }
directories = "5"
futures-util = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_tokio = { git = "https://github.com/zed-industries/zed", package = "gpui_tokio" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "779ee50742d3f2865d04c9d6b96a54168ab8d9d8" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
qrcode = "0.14"

[features]
default = []
automation = ["gpui/test-support"]
cargo-clippy = []

[target.'cfg(not(target_os = "macos"))'.dependencies]
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed", features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.0"
core-video = { version = "0.4.3", features = ["metal"] }
objc = "0.2"

[workspace]
