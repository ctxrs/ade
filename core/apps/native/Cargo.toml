[package]
name = "ctx-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
ctx-client = { path = "../../crates/ctx-client" }
ctx-core = { path = "../../crates/ctx-core" }
futures-util = "0.3"
gpui = "0.2.2"
gpui_tokio = "0.1.0"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
