[package]
name = "ctx-http"
version = "0.11.0"
edition.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
ctx-core = { path = "../ctx-core" }
ctx-events = { path = "../ctx-events" }
ctx-fs = { path = "../ctx-fs" }
ctx-providers = { path = "../ctx-providers" }
ctx-worker-protocol = { path = "../ctx-worker-protocol" }
ctx-lsp = { path = "../ctx-lsp" }
ctx-store = { path = "../ctx-store" }
directories.workspace = true
futures.workspace = true
http = "1"
http-body = "1"
httparse = "1.9"
reqwest.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
tikv-jemalloc-ctl = { version = "0.6.1", optional = true, features = ["profiling", "stats"] }
tikv-jemallocator = { version = "0.6.1", optional = true, features = ["profiling"] }
opentelemetry = { version = "0.23", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.23", features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.16", features = ["http-proto", "reqwest-client", "reqwest-rustls", "metrics"] }
toml = "0.8"
uuid.workspace = true
sysinfo.workspace = true
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
flate2 = "1"
tar = "0.4"
bzip2 = "0.5"
zip = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bytes = "1"
libc = "0.2"
mime_guess = "2"
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
rand_core = "0.6"
semver = "1"
atty = "0.2"
urlencoding = "2"
url = "2"
lsp-types = { version = "0.97", features = ["proposed"] }
similar = "2"
jsonwebtoken = "9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
fs2 = "0.4"
which = "7"
portable-pty = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tempfile = "3"
notify.workspace = true
toml_edit = "0.22"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"

[dev-dependencies]
azure_identity = { version = "0.21", default-features = false, features = ["development", "old_azure_cli", "enable_reqwest_rustls"] }
azure_core = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls"] }
gcp_auth = "0.12"
tempfile = "3"
reqwest.workspace = true

[features]
fault_injection = ["ctx-store/fault_injection"]
property_tests = []
daemon-heap-prof = ["dep:tikv-jemalloc-ctl", "dep:tikv-jemallocator"]

[[bin]]
name = "ctx"
path = "src/main.rs"
