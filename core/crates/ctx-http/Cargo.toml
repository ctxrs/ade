[package]
name = "ctx-http"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
ctx-core = { path = "../ctx-core" }
ctx-events = { path = "../ctx-events" }
ctx-fs = { path = "../ctx-fs" }
ctx-providers = { path = "../ctx-providers" }
ctx-worker-protocol = { path = "../ctx-worker-protocol" }
ctx-lsp = { path = "../ctx-lsp" }
ctx-store = { path = "../ctx-store" }
directories.workspace = true
futures.workspace = true
http = "1"
reqwest.workspace = true
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true
opentelemetry = { version = "0.23", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.23", features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.16", features = ["http-proto", "reqwest-client", "reqwest-rustls", "metrics"] }
toml = "0.8"
uuid.workspace = true
sysinfo.workspace = true
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }
flate2 = "1"
tar = "0.4"
bzip2 = "0.5"
zip = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
mime_guess = "2"
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
rand_core = "0.6"
semver = "1"
atty = "0.2"
urlencoding = "2"
url = "2"
lsp-types = { version = "0.97", features = ["proposed"] }
similar = "2"
jsonwebtoken = "9"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
fs2 = "0.4"
which = "7"
portable-pty = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tempfile = "3"
aws-config = "1"
aws-sdk-ec2 = "1"
aws-sdk-s3 = "1"
aws-sdk-sts = "1"
aws-credential-types = "1"
notify.workspace = true
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
hyper = { version = "1", features = ["full"] }
reqwest.workspace = true

[features]
fault_injection = ["ctx-store/fault_injection"]
property_tests = []

[[bin]]
name = "ctx"
path = "src/main.rs"
