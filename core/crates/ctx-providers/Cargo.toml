[package]
name = "ctx-providers"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
ctx-core = { path = "../ctx-core" }
ctx-events = { path = "../ctx-events" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
which = "7"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[features]
fuzz_tests = []
