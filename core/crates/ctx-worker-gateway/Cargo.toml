[package]
name = "ctx-worker-gateway"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64.workspace = true
chrono.workspace = true
clap.workspace = true
ctx-worker-protocol = { path = "../ctx-worker-protocol" }
futures-util = "0.3"
reqwest.workspace = true
rustls = { workspace = true, features = ["aws-lc-rs"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml = "0.8"
aws-config = "1"
aws-sdk-ec2 = "1"
gcp_auth = "0.12"
azure_identity = { version = "0.21", default-features = false, features = ["development", "old_azure_cli", "enable_reqwest_rustls"] }
azure_core = { version = "0.21", default-features = false, features = ["enable_reqwest_rustls"] }

[dev-dependencies]

[[bin]]
name = "ctx-worker-gateway"
path = "src/main.rs"
