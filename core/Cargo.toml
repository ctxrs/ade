[workspace]
members = [
  "crates/ctx-docs-mirror",
  "crates/ctx-core",
  "crates/ctx-client",
  "crates/ctx-store",
  "crates/ctx-fs",
  "crates/ctx-events",
  "crates/ctx-providers",
  "crates/ctx-lsp",
  "crates/ctx-mcp",
  "crates/ctx-http",
  "crates/ctx-worker-protocol",
  "crates/ctx-worker-gateway",
  "crates/ctx-worker-shim",
  "crates/ctx-tunnel-relay",
  "crates/ctx-tunnel-router",
  "crates/ctx-tunnel-control-plane",
]
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.lints]

[workspace.package]
edition = "2021"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate", "multipart"] }
rcgen = "0.13.2"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
gpui = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
gpui-component = { git = "https://github.com/ctxrs/gpui-component", rev = "76d64362a1c0bdf825f83efb0ae3f4cb93849bd7", version = "0.5.0" }
gpui-component-macros = { git = "https://github.com/ctxrs/gpui-component", rev = "76d64362a1c0bdf825f83efb0ae3f4cb93849bd7", version = "0.5.0" }
gpui-component-assets = { git = "https://github.com/ctxrs/gpui-component", rev = "76d64362a1c0bdf825f83efb0ae3f4cb93849bd7", version = "0.5.0" }
gpui-macros = "0.2.2"
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
rust-i18n = "3"
schemars = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
sysinfo = "0.30"

[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
gpui_tokio = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
gpui_macros = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
collections = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
http_client = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
media = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
refineable = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
sum_tree = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
util = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
util_macros = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
zlog = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
ztracing = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
ztracing_macro = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
perf = { git = "https://github.com/ctxrs/zed", rev = "6dac6cd7983e1c2d92e460f757fe45e3a3ad9886" }
