name = "ctx-telemetry"
main = "src/worker.ts"
compatibility_date = "2026-05-30"

[vars]
POSTHOG_HOST = "https://t.ctx.rs"
TELEMETRY_DEFAULT_ANALYTICS_ENVIRONMENT = "staging"

[env.staging]
name = "ctx-telemetry-staging"

[env.staging.vars]
POSTHOG_HOST = "https://t.ctx.rs"
TELEMETRY_DEFAULT_ANALYTICS_ENVIRONMENT = "staging"

[env.prod]
name = "ctx-telemetry"
routes = [
  { pattern = "https://telemetry.example.invalid/*", zone_name = "example.invalid" }
]

[env.prod.vars]
POSTHOG_HOST = "https://t.ctx.rs"
TELEMETRY_DEFAULT_ANALYTICS_ENVIRONMENT = "production"
