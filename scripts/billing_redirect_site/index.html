<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Return to ctx</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f17;
        --panel: rgba(255, 255, 255, 0.06);
        --text: #e6e9ef;
        --muted: rgba(230, 233, 239, 0.72);
        --btn: #1d4ed8;
        --btnText: #ffffff;
        --btn2: rgba(255, 255, 255, 0.08);
        --btn2Text: #e6e9ef;
        --border: rgba(255, 255, 255, 0.12);
      }

      body {
        margin: 0;
        background: radial-gradient(1200px 900px at 30% 0%, rgba(29, 78, 216, 0.25), transparent 60%),
          radial-gradient(900px 700px at 70% 20%, rgba(34, 197, 94, 0.18), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          "Apple Color Emoji",
          "Segoe UI Emoji";
      }

      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 560px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px 20px;
        backdrop-filter: blur(12px);
      }

      h1 {
        font-size: 18px;
        margin: 0 0 6px 0;
        letter-spacing: 0.2px;
      }

      p {
        margin: 0 0 16px 0;
        color: var(--muted);
        line-height: 1.5;
        font-size: 14px;
      }

      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      a.btn {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 12px 14px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 160px;
      }

      a.primary {
        background: var(--btn);
        color: var(--btnText);
      }

      a.secondary {
        background: var(--btn2);
        border-color: var(--border);
        color: var(--btn2Text);
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        color: rgba(230, 233, 239, 0.9);
      }

      .meta {
        margin-top: 14px;
        font-size: 12px;
        color: rgba(230, 233, 239, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Return to ctx</h1>
        <p>
          Your subscription flow is complete in the browser. Open ctx to continue.
        </p>

        <div class="row">
          <a id="open" class="btn primary" href="ctx://focus?v=1">Open ctx</a>
          <a id="retry" class="btn secondary" href="#">Try again</a>
        </div>

        <p class="meta">
          If your browser asks for permission, choose “Open ctx”. If ctx isn’t installed, this link won’t work.
        </p>
        <p class="meta"><code id="details"></code></p>
      </div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const kind = params.get("kind") || "";
        const source = params.get("source") || "";
        const v = params.get("v") || "";
        const details = document.getElementById("details");
        if (details) {
          details.textContent = ["v=" + v, "source=" + source, "kind=" + kind].filter(Boolean).join("  ");
        }

        const attempt = () => {
          window.location.href = "ctx://focus?v=1";
        };

        const retry = document.getElementById("retry");
        if (retry) {
          retry.addEventListener("click", (e) => {
            e.preventDefault();
            attempt();
          });
        }

        // Best-effort auto-attempt once.
        setTimeout(attempt, 50);
      })();
    </script>
  </body>
</html>
